<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Talita Lunar Lander</title>
<meta name="description" content="Retro lunar lander starring Talita. Keyboard, mouse, gamepad or phone tilt.">
<meta name="theme-color" content="#0d0b1f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Talita Lander">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none;
               touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
               -webkit-tap-highlight-color: transparent; }
  #stage { position: fixed; inset: 0; box-sizing: border-box;
           padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  #game { width: 100%; height: 100%; display: block; cursor: crosshair; }
  .px { image-rendering: crisp-edges; image-rendering: pixelated; }
  .digits { font-family: "Courier New", Courier, monospace; font-weight: 900; fill: #e3291d;
            stroke: #3a0805; stroke-width: 1.6px; paint-order: stroke; }
  .lbl { font-family: "Courier New", Courier, monospace; font-weight: 700; fill: #cfcfd4; font-size: 13px; letter-spacing: 2px; }
  .unit { font-family: "Courier New", Courier, monospace; font-weight: 700; fill: #b9b9c0; font-size: 15px; }
  .msg { font-family: "Courier New", Courier, monospace; font-weight: 900; text-anchor: middle;
         stroke: #000; stroke-width: 3px; paint-order: stroke; }
  .hint { font-family: "Courier New", Courier, monospace; fill: #8484a8; }
  .tw { animation: tw 3.2s infinite ease-in-out; }
  .blink { animation: bl 1s infinite steps(2, start); }
  @keyframes tw { 50% { opacity: .15; } }
  @keyframes bl { 50% { opacity: .2; } }

  /* HTML overlay (buttons sit exactly over the drawn game area) */
  #ui { position: fixed; pointer-events: none; }
  #ui button { pointer-events: auto; font: 700 15px "Courier New", Courier, monospace; color: #fff6fb;
               background: rgba(18, 16, 34, .42); border: 2px solid rgba(255, 95, 176, .65); border-radius: 10px;
               min-width: 38px; height: 38px; padding: 0 8px; cursor: pointer; touch-action: none; }
  #ui button:active, #ui button.on { background: rgba(255, 95, 176, .45); }
  #topBtns { position: absolute; top: 8px; right: 8px; display: flex; gap: 6px; }
  #touch { position: absolute; left: 10px; right: 10px; display: none; }
  body.touch #touch { display: block; }
  body.strip #stage { padding-bottom: calc(env(safe-area-inset-bottom) + 118px); }
  #ui #bTilt { display: none; }
  body.touch #ui #bTilt { display: inline-block; }
  #touch .l, #touch .r { position: absolute; bottom: 0; display: flex; gap: 12px; align-items: flex-end; }
  #touch .l { left: 0; } #touch .r { right: 0; }
  #ui .big { width: clamp(58px, 15vmin, 88px); height: clamp(58px, 15vmin, 88px); border-radius: 50%; font-size: 26px; }
  #ui #bThrust { width: clamp(78px, 22vmin, 124px); height: clamp(78px, 22vmin, 124px); border-radius: 50%;
                 font-size: 34px; border-color: #ff8a1e; background: rgba(90, 30, 10, .45); }
  #ui #bThrust.on { background: rgba(255, 138, 30, .55); }
  #ui #bTilt { font-size: 13px; }
  #ui #bTilt.on { border-color: #3fd24a; background: rgba(63, 210, 74, .3); }
  #toast { position: absolute; left: 50%; top: 54px; transform: translateX(-50%); max-width: 88%;
           font: 700 14px "Courier New", Courier, monospace; color: #fff; text-align: center;
           background: rgba(0, 0, 0, .75); border: 2px solid #ffd23c; border-radius: 10px; padding: 8px 12px;
           opacity: 0; transition: opacity .3s; }
  #toast.show { opacity: 1; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="stage">
<svg id="game" viewBox="0 0 960 640" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#02020a"/><stop offset="1" stop-color="#0d0b1f"/>
    </linearGradient>
    <linearGradient id="rock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#77777f"/><stop offset=".35" stop-color="#4b4b53"/><stop offset="1" stop-color="#1f1f25"/>
    </linearGradient>
    <radialGradient id="earthG" cx=".35" cy=".35" r=".8">
      <stop offset="0" stop-color="#7cc4ff"/><stop offset="1" stop-color="#1a4fa0"/>
    </radialGradient>
    <linearGradient id="earthShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset=".45" stop-color="#000" stop-opacity="0"/><stop offset=".8" stop-color="#000" stop-opacity=".85"/>
    </linearGradient>
    <pattern id="stripes" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#1b1b1b"/><rect width="5" height="10" fill="#ffd23c"/>
    </pattern>
    <pattern id="stone" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="#5a5a5f"/>
      <rect x="2" y="3" width="4" height="2" fill="#4b4b50"/><rect x="14" y="6" width="5" height="2" fill="#67676c"/>
      <rect x="8" y="12" width="3" height="3" fill="#4b4b50"/><rect x="18" y="16" width="4" height="2" fill="#4f4f54"/>
      <rect x="3" y="18" width="5" height="2" fill="#65656a"/><rect x="11" y="21" width="2" height="2" fill="#48484d"/>
    </pattern>
  </defs>

  <rect id="skyRect" width="960" height="540" fill="url(#sky)"/>
  <g id="stars"></g>
  <g id="earth" transform="translate(842,82)">
    <circle r="24" fill="url(#earthG)"/>
    <path d="M-12,-12 q7,-7 14,-1 q2,8 -7,11 q-9,1 -7,-10z" fill="#3fa34d"/>
    <path d="M3,6 q9,-3 11,4 q-4,9 -13,4z" fill="#3fa34d"/>
    <path d="M-18,4 q4,-2 7,2 q-2,5 -7,2z" fill="#3fa34d"/>
    <circle r="24" fill="url(#earthShade)"/>
  </g>
  <text id="hint" class="hint" x="12" y="20" font-size="12"></text>

  <g id="world">
    <polygon id="hills" fill="#15151f"/>
    <polygon id="terrain" fill="url(#rock)"/>
    <polyline id="ridge" fill="none" stroke="#a3a3ad" stroke-width="1.5" stroke-linejoin="bevel"/>
    <g id="craters"></g>
    <g id="pad">
      <rect id="padRect" height="6" fill="url(#stripes)" stroke="#000" stroke-width="1"/>
      <circle id="padL" r="3"/><circle id="padR" r="3"/>
      <text id="padArrow" class="msg blink" font-size="16" fill="#ffd23c">&#9660;</text>
    </g>
    <g id="dust"></g>
    <g id="lander">
      <g id="flame">
        <polygon id="flameO" fill="#ff7a1a" opacity=".9"/>
        <polygon id="flameI" fill="#fff3a0"/>
      </g>
      <circle id="rcsL" cx="-13" cy="-12" r="2.6" fill="#fff" opacity=".8"/>
      <circle id="rcsR" cx="13" cy="-12" r="2.6" fill="#fff" opacity=".8"/>
      <g stroke="#b9b9c2" stroke-width="2" stroke-linecap="round">
        <line x1="-8" y1="4" x2="-15" y2="13"/><line x1="8" y1="4" x2="15" y2="13"/>
        <line x1="-18" y1="14" x2="-12" y2="14"/><line x1="12" y1="14" x2="18" y2="14"/>
      </g>
      <polygon points="-4,6 4,6 6,11 -6,11" fill="#4a4a50" stroke="#222" stroke-width="1"/>
      <polygon points="-11,-3 11,-3 9,6 -9,6" fill="#d9a531" stroke="#6e4f10" stroke-width="1"/>
      <line x1="-8" y1="1.5" x2="8" y2="1.5" stroke="#f3cc62" stroke-width="1"/>
      <polygon points="-8,-3 -10,-9 -6,-16 6,-16 10,-9 8,-3" fill="#d9d9df" stroke="#62626a" stroke-width="1"/>
      <rect x="-9" y="-7" width="18" height="2" fill="#ff5fb0"/>
      <polygon points="-4,-14 4,-14 5,-9.5 -5,-9.5" fill="#1d2a48"/>
      <rect x="-3" y="-13" width="2" height="1.5" fill="#ffb0da"/>
      <line x1="5" y1="-16" x2="8" y2="-22" stroke="#9a9aa4" stroke-width="1"/>
      <circle cx="8" cy="-22" r="1.6" fill="#ff5fb0"/>
    </g>
    <g id="debris"></g>
    <circle id="flash" r="0" fill="#fff3b0" opacity="0"/>
  </g>
  <g id="offTop" display="none">
    <polygon id="offTri" fill="#ff5fb0"/>
    <text id="offTxt" class="msg" font-size="13" fill="#ffb0da"></text>
  </g>

  <!-- DOOM-style status bar: five panels, laid out in one row (wide screens) or two rows (phone portrait) -->
  <g id="bar" transform="translate(0,540)">
    <rect id="barBg" width="960" height="100" fill="url(#stone)"/>
    <g id="fillers"></g>
    <g id="pFuel" data-w="196">
      <text id="fuelTxt" class="digits" x="98" y="44" font-size="36" text-anchor="middle">100%</text>
      <rect x="16" y="56" width="164" height="14" fill="#1a1a1c" stroke="#2c2c30" stroke-width="2"/>
      <rect id="fuelBar" x="18" y="58" width="160" height="10" fill="#3fd24a"/>
      <text class="lbl" x="98" y="92" text-anchor="middle">FUEL</text>
    </g>
    <g id="pSpeed" data-w="232">
      <text class="lbl" x="14" y="36">H</text>
      <text id="hTxt" class="digits" x="134" y="38" font-size="30" text-anchor="end">0.0</text>
      <text id="hArr" class="unit" x="144" y="35">&#183;</text>
      <circle id="hLamp" cx="204" cy="28" r="7" stroke="#111" stroke-width="2"/>
      <text class="lbl" x="14" y="70">V</text>
      <text id="vTxt" class="digits" x="134" y="72" font-size="30" text-anchor="end">0.0</text>
      <text id="vArr" class="unit" x="144" y="69">&#183;</text>
      <circle id="vLamp" cx="204" cy="62" r="7" stroke="#111" stroke-width="2"/>
      <text class="lbl" x="116" y="94" text-anchor="middle">SPEED m/s</text>
    </g>
    <g id="pFace" data-w="104">
      <rect x="4" y="2" width="96" height="96" fill="#2a1a20"/>
      <image id="face" class="px" x="4" y="2" width="96" height="96" preserveAspectRatio="none"/>
    </g>
    <g id="pAlt" data-w="232">
      <text class="lbl" x="14" y="36">ALT</text>
      <text id="altTxt" class="digits" x="158" y="38" font-size="30" text-anchor="end">0</text>
      <text class="unit" x="166" y="35">m</text>
      <text class="lbl" x="14" y="70">ANG</text>
      <text id="angTxt" class="digits" x="158" y="72" font-size="30" text-anchor="end">0</text>
      <text class="unit" x="166" y="69">&#176;</text>
      <circle id="aLamp" cx="208" cy="62" r="7" stroke="#111" stroke-width="2"/>
      <text class="lbl" x="116" y="94" text-anchor="middle">ALT / ANGLE</text>
    </g>
    <g id="pScore" data-w="196">
      <text id="scoreTxt" class="digits" x="98" y="40" font-size="32" text-anchor="middle">0</text>
      <text id="rndTxt" class="digits" x="18" y="72" font-size="20">RND 1</text>
      <text id="livesTxt" x="180" y="72" font-size="18" text-anchor="end" fill="#ff5fb0"
            font-family="Courier New, monospace" font-weight="900"></text>
      <text class="lbl" x="98" y="94" text-anchor="middle">SCORE</text>
    </g>
  </g>

  <g id="msg"></g>
</svg>
</div>

<div id="ui">
  <div id="topBtns">
    <button id="bInstall" tabindex="-1" hidden title="Install as an app">&#11015; Install</button>
    <button id="bTilt" tabindex="-1" title="Steer by tilting the phone">TILT OFF</button>
    <button id="bPause" tabindex="-1" title="Pause (P / START)">&#10074;&#10074;</button>
    <button id="bRestart" tabindex="-1" title="Restart (R / SELECT)">&#8635;</button>
    <button id="bMute" tabindex="-1" title="Sound on/off (M)">&#9835;</button>
    <button id="bFull" tabindex="-1" title="Full screen">&#9974;</button>
  </div>
  <div id="touch">
    <div class="l">
      <button id="bL" class="big" tabindex="-1">&#9664;</button>
      <button id="bR" class="big" tabindex="-1">&#9654;</button>
    </div>
    <div class="r">
      <button id="bThrust" tabindex="-1">&#128293;</button>
    </div>
  </div>
  <div id="toast"></div>
</div>

/* ---------- tuning ---------- */
const PX = 4;                      // SVG units per meter
const G = 1.62 * PX;               // Moon gravity (px/s^2)
const THR = 4.6 * PX;              // main engine acceleration (px/s^2)
const ROT = 100;                   // rotation speed (deg/s)
const BURN = 8.5;                  // fuel burn (% per second of thrust)
const SAFE_VY = 3.0, SAFE_VX = 2.0, SAFE_ANG = 8;   // landing limits (m/s, m/s, deg)
const LIVES = 3;
const MOUSE_AIM = true;            // while the mouse button is held, the nose turns toward the pointer
const TILT_SENS = 1.6;             // lander angle per degree of phone tilt
const HULL = [[-15,14],[15,14],[-11,-3],[11,-3],[-10,-9],[10,-9],[-6,-16],[6,-16],[0,11],[-9,6],[9,6]];

const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const svg = $('game');

/* ---------- responsive layout ----------
   The world is always 540..1400 units tall and 640..1600 wide, chosen to match the screen shape,
   so there is no letterboxing. Phones in portrait get a two-row status bar. */
let W = 960, H = 540, BH = 100, TOT = 640, twoRow = false, uiS = 1, layoutKey = '';
function computeLayout() {
  const portraitPhone = innerWidth < innerHeight && innerWidth < 700;
  document.body.classList.toggle('strip', portraitPhone && isTouch);     // controls get their own strip
  const r = svg.getBoundingClientRect();
  const vw = r.width || innerWidth, vh = r.height || innerHeight, a = vw / vh;
  twoRow = a < 1 && vw < 700;
  if (twoRow) {
    W = 640; BH = Math.round(100 * W / 496 + 100 * W / 464);
    TOT = clamp(Math.round(W / a), 900, 1450); uiS = 1.15;
  } else {
    BH = 100; uiS = 1;
    const base = vh < 500 ? 560 : 640;
    if (a >= 960 / base) { TOT = base; W = clamp(Math.round(base * a), 960, 1600); }
    else { W = 960; TOT = clamp(Math.round(960 / a), base, 1400); }
  }
  H = TOT - BH;
}
function bevel(w, h) {
  return `<line x1="1" y1="1" x2="${w - 1}" y2="1" stroke="#8d8d93" stroke-width="2"/>` +
         `<line x1="1" y1="1" x2="1" y2="${h - 1}" stroke="#8d8d93" stroke-width="2"/>` +
         `<line x1="1" y1="${h - 1}" x2="${w - 1}" y2="${h - 1}" stroke="#26262a" stroke-width="2"/>` +
         `<line x1="${w - 1}" y1="1" x2="${w - 1}" y2="${h - 1}" stroke="#26262a" stroke-width="2"/>`;
}
function layoutBar() {
  $('bar').setAttribute('transform', `translate(0,${H})`);
  $('barBg').setAttribute('width', W); $('barBg').setAttribute('height', BH);
  const place = (id, x, y, s) => $(id).setAttribute('transform', `translate(${x.toFixed(1)},${y.toFixed(1)}) scale(${s.toFixed(4)})`);
  let fill = '';
  if (!twoRow) {
    const ox = Math.round((W - 960) / 2);
    let x = ox;
    for (const id of ['pFuel', 'pSpeed', 'pFace', 'pAlt', 'pScore']) { place(id, x, 0, 1); x += +$(id).dataset.w; }
    if (ox > 0) {
      fill += `<g>${bevel(ox, 100)}</g><g transform="translate(${ox + 960},0)">${bevel(W - ox - 960, 100)}</g>`;
    }
  } else {
    const s1 = W / 496, s2 = W / 464;
    place('pFuel', 0, 0, s1); place('pFace', 196 * s1, 0, s1); place('pScore', 300 * s1, 0, s1);
    place('pSpeed', 0, 100 * s1, s2); place('pAlt', 232 * s2, 100 * s1, s2);
  }
  $('fillers').innerHTML = fill;
}
function applyLayout(initial) {
  computeLayout();
  const key = [W, H, BH, twoRow, isTouch].join();
  if (key !== layoutKey) {
    layoutKey = key;
    svg.setAttribute('viewBox', `0 0 ${W} ${TOT}`);
    $('skyRect').setAttribute('width', W); $('skyRect').setAttribute('height', H);
    $('earth').setAttribute('transform', `translate(${W - 118},${isTouch ? 150 : 82})`);
    $('hint').style.display = twoRow ? 'none' : '';
    $('hint').setAttribute('font-size', (12 * uiS).toFixed(1));
    layoutBar(); buildStars(); updateHint();
    if (!initial) onWorldResized();
  }
  positionUI();
}
function positionUI() {
  const r = svg.getBoundingClientRect();
  const s = Math.min(r.width / W, r.height / TOT);
  const gw = W * s, gh = TOT * s, gx = r.left + (r.width - gw) / 2, gy = r.top + (r.height - gh) / 2;
  const ui = $('ui').style;
  ui.left = gx + 'px'; ui.top = gy + 'px'; ui.width = gw + 'px'; ui.height = gh + 'px';
  const t = $('touch').style;
  if (document.body.classList.contains('strip')) { t.top = (gh + 108) + 'px'; t.transform = 'none'; }
  else { t.top = (H * s - 12) + 'px'; t.transform = 'translateY(-100%)'; }
}
function onWorldResized() {
  debris = []; dust = [];
  switch (S.mode) {
    case 'title': newTerrain(); spawn(); showTitle(); break;
    case 'over': newTerrain(); banner(S.cur); break;
    case 'landed': S.paused = false; S.round++; startRound(false); break;
    default: S.paused = false; startRound(false);        // same round, fresh terrain; no life lost
  }
}
let resizeT = 0;
addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => applyLayout(false), 120); });
addEventListener('orientationchange', () => setTimeout(() => applyLayout(false), 250));

/* ---------- audio (Web Audio, generated) ---------- */
let AC = null, master = null, thrGain = null, thrFilter = null, noiseBuf = null, muted = false;
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  master = AC.createGain(); master.gain.value = muted ? 0 : 0.6; master.connect(AC.destination);
  noiseBuf = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);

/* ---------- terrain ---------- */
function groundY(x) {
  x = ((x % W) + W) % W;
  const p = T.pts;
  for (let i = 1; i < p.length; i++) {
    if (x <= p[i][0]) {
      const a = p[i - 1], b = p[i], k = (x - a[0]) / ((b[0] - a[0]) || 1);
      return a[1] + (b[1] - a[1]) * k;
    }
  }
  return p[p.length - 1][1];
}
function newTerrain() {
  const padW = Math.max(44, 124 - (S.round - 1) * 10);          // a bit narrower every round
  const padX1 = Math.round(rand(70, W - 70 - padW)), padX2 = padX1 + padW;
  const padY = Math.round(rand(H - 135, H - 55));
  const lo = H - 195, hi = H - 18;
  let y = rand(H - 150, H - 40);
  const h = x => {
    y = clamp(y + rand(-44, 44), lo, hi);                         // rocky random walk
    const d = x < padX1 ? padX1 - x : x - padX2;
    const k = clamp(d / 80, 0, 1);                               // blend toward pad level nearby
    return Math.round((1 - k) * (padY + rand(2, 24)) + k * y);
  };
  const pts = [];
  let x = 0;
  while (x < padX1 - 10) { pts.push([Math.round(x), h(x)]); x += rand(14, 32); }
  pts.push([padX1, padY], [padX2, padY]);
  x = padX2 + rand(10, 24);
  while (x < W - 8) { pts.push([Math.round(x), h(x)]); x += rand(14, 32); }
  pts.push([W, pts[0][1]]);                                       // seamless wrap
  Object.assign(T, { pts, padX1, padX2, padY, padW });

}
function drawTerrain() {
  const line = T.pts.map(p => p[0] + ',' + p[1]).join(' ');
  $('terrain').setAttribute('points', line + ` ${W},${TOT} 0,${TOT}`);
  $('ridge').setAttribute('points', line);
  const ph1 = rand(0, 6), ph2 = rand(0, 6);
  let hills = '';
  for (let x = 0; x <= W; x += 20)
    hills += `${x},${(H - 210 + Math.sin(x * 0.013 + ph1) * 32 + Math.sin(x * 0.043 + ph2) * 14).toFixed(1)} `;
  $('hills').setAttribute('points', hills + `${W},${H} 0,${H}`);
  let cr = '';
  for (let i = 0; i < Math.round(W / 70); i++) {
    const cx = rand(20, W - 20), rx = rand(5, 16);
    if (cx > T.padX1 - 25 && cx < T.padX2 + 25) continue;
    const cy = Math.max(groundY(cx - rx), groundY(cx), groundY(cx + rx)) + rand(12, 50);
    if (cy > H - 8) continue;
    cr += `<ellipse cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" rx="${rx.toFixed(1)}" ry="${(rx * .3).toFixed(1)}" fill="#34343c" stroke="#1a1a20" stroke-width="1"/>`;
  }
  $('craters').innerHTML = cr;
  const pr = $('padRect');
  pr.setAttribute('x', T.padX1); pr.setAttribute('y', T.padY); pr.setAttribute('width', T.padW);
  $('padL').setAttribute('cx', T.padX1 + 3); $('padL').setAttribute('cy', T.padY - 3);
  $('padR').setAttribute('cx', T.padX2 - 3); $('padR').setAttribute('cy', T.padY - 3);
  $('padArrow').setAttribute('x', (T.padX1 + T.padX2) / 2); $('padArrow').setAttribute('y', T.padY - 16);
}

/* ---------- lander ---------- */
function toWorld(p) {
  const r = L.ang * Math.PI / 180, c = Math.cos(r), s = Math.sin(r);

}

  Object.assign(L, { x, y: Math.max(60, H - 480), vx: rand(-3, 3) * PX, vy: rand(0, 1.5) * PX, ang: 0, fuel: 100,

function checkContact() {

    { t: `Round +${base} · Fuel +${fuelB} · Aim +${acc} · Soft +${soft}`, s: 17, c: '#cfcfd4' },
    { t: `+${total} POINTS`, s: 26, c: '#ffb0da' },

/* ---------- particles ---------- */
function explode(x, y) {

  for (let i = 0; i < 80; i++) {

    debris.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rand(1.5, 3.2),
                  s: rand(2, 5), c: cols[i % cols.length] });
  }
  for (let i = 0; i < 14; i++)
    debris.push({ smoke: true, x: x + rand(-10, 10), y: y + rand(-6, 6), vx: rand(-14, 14), vy: rand(-26, -8),
                  r: rand(4, 9), life: rand(1.6, 2.8) });

}
function updateParticles(dt) {
  for (const p of debris) {
    p.life -= dt;
    if (p.smoke) { p.x += p.vx * dt; p.y += p.vy * dt; p.r += dt * 12; continue; }
    p.vy += G * 2.5 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    const gy = groundY(p.x);
    if (p.y > gy) { p.y = gy; p.vy *= -0.35; p.vx *= 0.6; }
  }
  debris = debris.filter(p => p.life > 0);
  for (const p of dust) { p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += G * dt; p.r += dt * 6; }
  dust = dust.filter(p => p.life > 0);
}

/* =====================================================================
   INPUT: keyboard + mouse + touch buttons + phone tilt + USB gamepad.
   Each source feeds one of: rotation rate (-1..1), target angle, thrust.
   ===================================================================== */
let isTouch = matchMedia('(pointer: coarse)').matches;
const mouse = { down: false, x: 0, y: 0 };
const touchHold = new Set();                 // fingers held on the playfield = thrust
const tb = { L: false, R: false, thr: false };

/* --- phone tilt: gravity vector projected on the screen, relative to how the phone was held at launch --- */

function onMotion(e) {

}

}

      if (!tilt.has) {

      } else { calibrateTilt(); toast('Tilt ON — hold the phone how you like, then tilt to steer'); }
    }, 700);
  };

    if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
      DeviceMotionEvent.requestPermission().then(r => {
        if (r === 'granted') start(); else toast('Motion access was not allowed — use ◀ ▶', 3500);
      }).catch(() => toast('Tilt not available — use ◀ ▶', 3500));

}

  else enableTilt();
}

/* --- USB gamepad (PS3-style clones included) --- */
const pad = { gp: null, id: '', prev: [], rot: 0, thr: false };

  if (pad.id !== gp.id) { pad.id = gp.id; pad.prev = []; updateHint(); }
  const btn = i => !!gp.buttons[i] && (gp.buttons[i].pressed || gp.buttons[i].value > 0.5);
  const ax = i => gp.axes[i] || 0;

  }
  let rot = 0;
  const sx = ax(0);
  if (Math.abs(sx) > 0.18) rot = (sx - Math.sign(sx) * 0.18) / 0.82;  // analog stick with dead zone
  if (left) rot = -1; if (right) rot = 1;
  pad.rot = clamp(rot, -1, 1);
  let fire = up || ax(1) < -0.55;                                     // stick up or D-pad up
  for (let i = 0; i <= 7; i++) if (btn(i)) fire = true;               // any face / shoulder / trigger button
  pad.thr = fire;
  // edge-triggered menu buttons
  const pressed = i => btn(i) && !pad.prev[i];
  if (pressed(9)) { initAudio(); if (S.mode === 'title' || S.mode === 'over') newGame(); else togglePause(); }
  if (pressed(8)) newGame();
  if (S.mode === 'title' || (S.mode === 'over' && S.t - S.overT > 1)) {
    for (let i = 0; i <= 7; i++) if (pressed(i)) { initAudio(); newGame(); break; }
  }
  pad.prev = gp.buttons.map((b, i) => btn(i));
}

/* --- keyboard --- */
addEventListener('keydown', e => {
  const k = e.key;
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(k)) e.preventDefault();
  initAudio();
  if (!e.repeat) {
    if (k === 'p' || k === 'P') { togglePause(); return; }
    if (k === 'r' || k === 'R') { newGame(); return; }
    if (k === 'm' || k === 'M') { toggleMute(); return; }
    if ((S.mode === 'title' || S.mode === 'over') && (k === 'ArrowUp' || k === ' ' || k === 'Enter')) {
      if (S.mode === 'title' || S.t - S.overT > 1) { newGame(); return; }
    }
  }
  keys[k] = true;
});
addEventListener('keyup', e => { keys[e.key] = false; });

/* --- mouse & touch on the playfield --- */
function markTouch() {
  if (isTouch) return;
  isTouch = true; document.body.classList.add('touch'); updateHint();
  applyLayout(false);
  if (S.mode === 'title') showTitle();
}
function toSvg(e) {
  const m = svg.getScreenCTM();
  if (!m) return;
  const p = new DOMPoint(e.clientX, e.clientY).matrixTransform(m.inverse());
  mouse.x = p.x; mouse.y = p.y;
}
svg.addEventListener('pointerdown', e => {
  e.preventDefault();
  initAudio();
  if (e.pointerType === 'touch') markTouch();
  if (S.mode === 'title' || S.mode === 'over') {
    if (S.mode === 'over' && S.t - S.overT < 1) return;
    if (e.pointerType === 'touch' && !tilt.asked) { tilt.asked = true; enableTilt(); }
    newGame(); return;
  }
  if (e.pointerType === 'mouse') {
    if (e.button !== 0) return;
    mouse.down = true; toSvg(e);
    try { svg.setPointerCapture(e.pointerId); } catch (err) {}
  } else touchHold.add(e.pointerId);
});
svg.addEventListener('pointermove', e => { if (e.pointerType === 'mouse') toSvg(e); });
const release = e => { if (e.pointerType === 'mouse') mouse.down = false; else touchHold.delete(e.pointerId); };
svg.addEventListener('pointerup', release);
svg.addEventListener('pointercancel', release);
svg.addEventListener('contextmenu', e => e.preventDefault());

/* --- on-screen buttons --- */
function holdBtn(id, key) {
  const b = $(id);
  const on = e => { e.preventDefault(); initAudio(); markTouch(); tb[key] = true; b.classList.add('on');
                    try { b.setPointerCapture(e.pointerId); } catch (err) {} };
  const off = () => { tb[key] = false; b.classList.remove('on'); };
  b.addEventListener('pointerdown', on);
  b.addEventListener('pointerup', off); b.addEventListener('pointercancel', off); b.addEventListener('lostpointercapture', off);
  b.addEventListener('contextmenu', e => e.preventDefault());
}
holdBtn('bL', 'L'); holdBtn('bR', 'R'); holdBtn('bThrust', 'thr');
function tapBtn(id, fn) {
  const b = $(id);
  b.addEventListener('pointerdown', e => { e.preventDefault(); initAudio(); });
  b.addEventListener('click', e => { e.preventDefault(); fn(); b.blur(); });
}
tapBtn('bTilt', () => { tilt.asked = true; toggleTilt(); });
tapBtn('bPause', () => { if (S.mode === 'title' || S.mode === 'over') newGame(); else togglePause(); });
tapBtn('bRestart', askRestart);
tapBtn('bMute', toggleMute);
tapBtn('bFull', toggleFull);

/* --- full screen + landscape lock (Android), install prompt --- */
const standalone = matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches || navigator.standalone;
const canFull = !!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen);
if (standalone || !canFull) $('bFull').hidden = true;
function toggleFull() {
  const d = document, el = d.documentElement;
  if (!d.fullscreenElement && !d.webkitFullscreenElement) {
    const p = (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
    Promise.resolve(p).then(() => {
      if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {});
    }).catch(() => {});
  } else (d.exitFullscreen || d.webkitExitFullscreen).call(d);
}
let installEvt = null;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; $('bInstall').hidden = false; });
addEventListener('appinstalled', () => { $('bInstall').hidden = true; toast('Installed! Find Talita Lander on your home screen'); });
tapBtn('bInstall', () => { if (!installEvt) return; installEvt.prompt(); installEvt = null; $('bInstall').hidden = true; });

/* --- pause when the app goes to the background --- */
function autoPause() {
  for (const k in keys) keys[k] = false;
  mouse.down = false; touchHold.clear(); tb.L = tb.R = tb.thr = false;
  if (S.mode === 'fly' && !S.paused) togglePause();
}
addEventListener('blur', autoPause);
document.addEventListener('visibilitychange', () => { if (document.hidden) autoPause(); });

/* --- combine every source into this frame's controls --- */
function readControls() {
  let rot = (keys.ArrowRight ? 1 : 0) - (keys.ArrowLeft ? 1 : 0) + (tb.R ? 1 : 0) - (tb.L ? 1 : 0) + pad.rot;
  rot = clamp(rot, -1, 1);
  const thr = !!(keys.ArrowUp || keys[' '] || mouse.down || tb.thr || touchHold.size || pad.thr);
  let target = null;
  if (Math.abs(rot) < 0.05) {
    if (MOUSE_AIM && mouse.down) {
      let dx = mouse.x - L.x, dy = mouse.y - L.y;
      if (Math.hypot(dx, dy) > 24) target = clamp(Math.atan2(dx, -dy) * 180 / Math.PI, -100, 100);
      else target = L.ang;
    } else if (tiltUsable()) target = tiltTarget();
  }
  return { rot, thr, target };
}

/* ---------- update ---------- */
function physics(dt) {
  const c = readControls();
  L.thr = c.thr && L.fuel > 0;
  const steps = 4, h = dt / steps;
  let turn = 0;
  for (let i = 0; i < steps && S.mode === 'fly'; i++) {
    let rate;
    if (c.target !== null) rate = clamp((c.target - L.ang) * 6, -ROT * 1.2, ROT * 1.2);
    else rate = c.rot * ROT;
    L.ang += rate * h; turn = rate / ROT;
    if (L.ang > 180) L.ang -= 360;
    if (L.ang < -180) L.ang += 360;
    let ax = 0, ay = G;
    if (L.thr) {
      const r = L.ang * Math.PI / 180;
      ax += Math.sin(r) * THR; ay -= Math.cos(r) * THR;
      L.fuel = Math.max(0, L.fuel - BURN * h);
      if (L.fuel === 0) L.thr = false;
    }
    L.vx += ax * h; L.vy += ay * h;
    L.x += L.vx * h; L.y += L.vy * h;
    L.x = ((L.x % W) + W) % W;                                   // wrap left/right
    if (L.y < -600) { L.y = -600; if (L.vy < 0) L.vy = 0; }
    checkContact();
  }
  L.rot = Math.abs(turn) > 0.15 ? Math.sign(turn) : 0;
  if (S.mode !== 'fly') return;
  if (L.rot) { rcsCD -= dt; if (rcsCD <= 0) { sfx.rcs(); rcsCD = 0.14; } } else rcsCD = 0;
  if (L.fuel > 0 && L.fuel < 20) { beepCD -= dt; if (beepCD <= 0) { sfx.beep(); beepCD = 0.6; } }
  if (L.thr && altitude() < 32) {
    for (let i = 0; i < 2; i++) {
      const x = L.x + rand(-8, 8);
      dust.push({ x, y: groundY(x) - 1, vx: (Math.random() < .5 ? -1 : 1) * rand(30, 95), vy: -rand(4, 22),
                  r: rand(1, 2.5), life: rand(0.5, 0.9) });
    }
  }
}
function update(dt) {
  S.t += dt;
  setThrustSound(S.mode === 'fly' && L.thr && !S.paused);
  if (S.paused) return;
  updateParticles(dt);
  shake = Math.max(0, shake - dt);
  flash = Math.max(0, flash - dt * 1.8);
  switch (S.mode) {
    case 'ready':
      S.timer -= dt;
      if (S.timer <= 0) { S.mode = 'fly'; hideBanner(); calibrateTilt(); }
      break;
    case 'fly': physics(dt); break;
    case 'landed':
      S.timer -= dt;
      if (S.timer <= 0) { S.round++; startRound(false); }
      break;
    case 'crashed':
      S.timer -= dt;
      if (S.timer <= 0) { if (S.lives > 0) startRound(true); else gameOver(); }
      break;
  }
}

/* ---------- render ---------- */
const txtCache = {};
function setText(id, v) { if (txtCache[id] !== v) { txtCache[id] = v; $(id).textContent = v; } }
function lamp(id, ok) { $(id).setAttribute('fill', ok ? '#3fd24a' : '#ff3b2f'); }
function pickFace() {
  if (S.mode === 'title') return 'happy';
  if (S.mode === 'over') return 'sad';
  if (S.paused) return 'neutral';
  if (S.mode === 'crashed') return (S.t - S.crashT < 1.3) ? 'hurt' : 'sad';
  if (S.mode === 'landed') return S.perfect ? 'super' : 'happy';
  if (S.mode === 'ready') return 'neutral';
  const alt = altitude(), vy = L.vy / PX;
  if (alt < 60 && vy > SAFE_VY * 1.6) return 'surprised';
  if (L.fuel <= 0) return 'angry';
  if (L.fuel < 20) return (Math.floor(S.t * 2.5) % 2) ? 'surprised' : 'neutral';
  if (alt < 25 && vy <= SAFE_VY && Math.abs(L.vx / PX) <= SAFE_VX && Math.abs(L.ang) <= SAFE_ANG) return 'happy';
  return 'neutral';
}
let curFace = '';
function render() {
  const flying = S.mode === 'fly' && !S.paused;
  const lg = $('lander');
  lg.setAttribute('transform', `translate(${L.x.toFixed(1)},${L.y.toFixed(1)}) rotate(${L.ang.toFixed(1)})`);
  lg.style.display = (L.alive && S.mode !== 'title' && S.mode !== 'over') ? '' : 'none';
  if (flying && L.thr) {
    const len = 16 + Math.random() * 14;
    $('flameO').setAttribute('points', `-6,11 6,11 0,${(11 + len).toFixed(1)}`);
    $('flameI').setAttribute('points', `-3,11 3,11 0,${(11 + len * 0.55).toFixed(1)}`);
    $('flame').style.display = '';
  } else $('flame').style.display = 'none';
  $('rcsL').style.display = flying && L.rot > 0 ? '' : 'none';
  $('rcsR').style.display = flying && L.rot < 0 ? '' : 'none';
  $('bThrust').classList.toggle('on', flying && L.thr);

  $('world').setAttribute('transform', shake > 0
    ? `translate(${(rand(-1, 1) * shake * 14).toFixed(1)},${(rand(-1, 1) * shake * 14).toFixed(1)})` : '');
  const fl = $('flash');
  fl.setAttribute('cx', flashX); fl.setAttribute('cy', flashY);
  fl.setAttribute('r', (8 + (1 - flash) * 90).toFixed(1)); fl.setAttribute('opacity', (flash * 0.85).toFixed(2));

  let ds = '';
  for (const p of debris) {
    if (p.smoke) ds += `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${p.r.toFixed(1)}" fill="#6d6d78" opacity="${clamp(p.life * 0.3, 0, 0.5).toFixed(2)}"/>`;
    else ds += `<rect x="${(p.x - p.s / 2).toFixed(1)}" y="${(p.y - p.s / 2).toFixed(1)}" width="${p.s.toFixed(1)}" height="${p.s.toFixed(1)}" fill="${p.c}" opacity="${clamp(p.life, 0, 1).toFixed(2)}"/>`;
  }
  $('debris').innerHTML = ds;
  let us = '';
  for (const p of dust) us += `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${p.r.toFixed(1)}" fill="#bdb5a4" opacity="${clamp(p.life * 0.7, 0, 0.6).toFixed(2)}"/>`;
  $('dust').innerHTML = us;

  const blink = Math.floor(S.t * 2) % 2;
  const padCol = S.mode === 'landed' ? '#3fd24a' : (blink ? '#ff3b3b' : '#ffe24a');
  $('padL').setAttribute('fill', padCol); $('padR').setAttribute('fill', padCol);

  const off = $('offTop');
  if (L.alive && L.y < -4 && S.mode === 'fly') {
    off.setAttribute('display', '');
    $('offTri').setAttribute('points', `${L.x.toFixed(0)},4 ${(L.x - 7).toFixed(0)},16 ${(L.x + 7).toFixed(0)},16`);
    const ot = $('offTxt'); ot.setAttribute('x', L.x.toFixed(0)); ot.setAttribute('y', 32);
    ot.textContent = Math.round(altitude()) + ' m';
  } else off.setAttribute('display', 'none');

  // HUD
  const vx = L.vx / PX, vy = L.vy / PX;
  setText('fuelTxt', Math.ceil(L.fuel) + '%');
  const fb = $('fuelBar');
  fb.setAttribute('width', (160 * L.fuel / 100).toFixed(1));
  fb.setAttribute('fill', L.fuel > 50 ? '#3fd24a' : L.fuel > 20 ? '#ffd23c' : '#ff3b2f');
  setText('hTxt', Math.abs(vx).toFixed(1));
  setText('hArr', vx > 0.05 ? '→' : vx < -0.05 ? '←' : '·');
  setText('vTxt', Math.abs(vy).toFixed(1));
  setText('vArr', vy > 0.05 ? '↓' : vy < -0.05 ? '↑' : '·');
  lamp('hLamp', Math.abs(vx) <= SAFE_VX);
  lamp('vLamp', vy <= SAFE_VY);
  setText('altTxt', String(Math.round(altitude())));
  setText('angTxt', String(Math.round(L.ang)));
  lamp('aLamp', Math.abs(L.ang) <= SAFE_ANG);
  setText('scoreTxt', String(S.score));
  setText('rndTxt', 'RND ' + S.round);
  setText('livesTxt', '♥'.repeat(Math.max(0, S.lives)) + '♡'.repeat(LIVES - Math.max(0, S.lives)));

  const f = pickFace();
  if (f !== curFace) { curFace = f; $('face').setAttribute('href', FACES[f]); }
}

/* ---------- main loop ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  pollPad();
  update(dt);
  render();
  requestAnimationFrame(frame);
}
if (isTouch) document.body.classList.add('touch');
buildPanelBevels();
applyLayout(true);
newTerrain(); spawn(); showTitle();
if (isTouch && innerWidth < innerHeight) setTimeout(() => toast('Tip: turn the phone sideways ↻ for a bigger view', 4000), 900);
requestAnimationFrame(frame);

/* ---------- PWA: offline cache (needs http:// or https://, not file://) ---------- */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
